name: Build Halaqati APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout private Halaqati source repository
        uses: actions/checkout@v4
        with:
          repository: syounis212004-sys/halaqati-app
          token: ${{ secrets.HALAQATI_REPO_TOKEN }}
          path: private-repo
          fetch-depth: 1

      - name: Verify and extract frozen source
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA256="48896929ebafe053a2b959fa86169d639e8f5e52ec5f1b5f6e8ce2e020c14c08"
          ZIP_FILE="$(find "$GITHUB_WORKSPACE/private-repo" -maxdepth 1 -type f -name "*.zip" | head -n 1)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ERROR: Halaqati source ZIP was not found."
            exit 1
          fi

          ACTUAL_SHA256="$(sha256sum "$ZIP_FILE" | awk '{print $1}')"
          echo "Source archive SHA-256: $ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: Frozen source SHA-256 mismatch."
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted/Halaqati_Native_Kotlin_v2.45.2"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle.properties"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Upgrade Kotlin and migrate compiler DSL
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          root = Path("build.gradle.kts")
          app = Path("app/build.gradle.kts")

          root_text = root.read_text(encoding="utf-8")
          app_text = app.read_text(encoding="utf-8")

          replacements = {
              'id("org.jetbrains.kotlin.android") version "2.2.21" apply false':
                  'id("org.jetbrains.kotlin.android") version "2.4.20" apply false',
              'id("org.jetbrains.kotlin.plugin.compose") version "2.2.21" apply false':
                  'id("org.jetbrains.kotlin.plugin.compose") version "2.4.20" apply false',
          }

          for old, new in replacements.items():
              if old not in root_text:
                  raise SystemExit(f"ERROR: expected plugin declaration not found: {old}")
              root_text = root_text.replace(old, new, 1)

          legacy = '    kotlinOptions { jvmTarget = "17" }\n'
          if legacy not in app_text:
              raise SystemExit("ERROR: legacy kotlinOptions JVM target was not found")
          app_text = app_text.replace(legacy, "", 1)

          compiler_block = (
              'kotlin {\n'
              '    compilerOptions {\n'
              '        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")\n'
              '    }\n'
              '}\n\n'
          )

          anchor = '\ndependencies {\n'
          if anchor not in app_text:
              raise SystemExit("ERROR: dependencies block not found")
          app_text = app_text.replace(anchor, '\n' + compiler_block + 'dependencies {\n', 1)

          root.write_text(root_text, encoding="utf-8")
          app.write_text(app_text, encoding="utf-8")
          PY

      - name: Restore Firebase configuration
        shell: bash
        env:
          FIREBASE_JSON: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_JSON_B64: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("FIREBASE_JSON", "").strip()
          b64 = os.environ.get("FIREBASE_JSON_B64", "").strip()
          target = Path("app/google-services.json")

          if b64:
              target.write_bytes(base64.b64decode(b64, validate=False))
          elif raw:
              target.write_text(raw, encoding="utf-8")
          else:
              raise SystemExit(
                  "ERROR: Add HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON "
                  "or HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 as a repository secret."
              )

          data = json.loads(target.read_text(encoding="utf-8"))
          packages = [
              c.get("client_info", {})
               .get("android_client_info", {})
               .get("package_name")
              for c in data.get("client", [])
          ]
          if "com.mohammedsamir.halaqati" not in packages:
              raise SystemExit(f"ERROR: Firebase package mismatch: {packages}")

          print("Firebase configuration verified.")
          PY

      - name: Configure high-memory Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          cat >> gradle.properties <<'EOF'

          # GitHub public 16 GB runner CI profile
          org.gradle.jvmargs=-Xmx2048m -Xms256m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=daemon
          kotlin.daemon.jvmargs=-Xmx9216m -Xms512m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=384m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.useFallbackStrategy=false
          kotlin.incremental=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.caching=true
          org.gradle.vfs.watch=false
          EOF

          mkdir -p "$HOME/.gradle"
          cp gradle.properties "$HOME/.gradle/gradle.properties"

          echo "=== Runner memory ==="
          free -h
          echo "=== Effective CI memory profile ==="
          grep -E '^(org.gradle.jvmargs|kotlin.compiler.execution.strategy|kotlin.daemon.jvmargs|org.gradle.workers.max)=' gradle.properties

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Static migration checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 scripts/compile-sanity-check.py
          python3 scripts/compose-risk-check.py
          python3 scripts/static-parity-check.py
          python3 scripts/uiux-pro-max-check.py
          python3 scripts/navigation-contract-check.py
          python3 scripts/release-contract-check.py
          python3 scripts/auth-push-privacy-check.py
          python3 scripts/smart-plan-alerts-check.py
          python3 scripts/offline-account-scope-check.py
          python3 scripts/local-sensitive-account-scope-check.py
          python3 scripts/manifest-contract-check.py

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --max-workers=1 --stacktrace :app:assembleDebug
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 7
