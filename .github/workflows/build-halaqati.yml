name: Halaqati - source compiler fix
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Repository containing the fixed ZIP (owner/name); blank = this repository'
        default: 'syounis212004-sys/halaqati-app'
        type: string
      source_ref:
        description: 'Source branch, tag or commit'
        default: 'main'
        type: string
      variant:
        description: 'debug for testing; release for an update signed with your existing key'
        default: debug
        type: choice
        options: [debug, release]
permissions:
  contents: read
concurrency:
  group: halaqati-fixed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  ARCHIVE_SHA256: 4da3186c0528fdbe8b9bfeade149ae738e0bcdb40e9567c5c512b64204c9adee
  PROJECT_DIR: ${{ github.workspace }}/extracted/Halaqati_Native_Kotlin_v2.45.2
  GRADLE_VERSION: '8.13'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || secrets.HALAQATI_SOURCE_TOKEN || secrets.SOURCE_PAT || secrets.GH_PAT || github.token }}
          path: source-repo
          persist-credentials: false

      - name: Verify exact fixed archive and extract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          matches = [p for p in Path('source-repo').rglob('Halaqati_Native_Kotlin_v2_45_2_BUILD_FIX*.zip')
                     if '.git' not in p.parts and hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['ARCHIVE_SHA256']]
          if len(matches) != 1:
              raise SystemExit('Upload exactly one matching Halaqati_Native_Kotlin_v2_45_2_BUILD_FIX.zip to the selected source repository/ref.')
          dest = Path('extracted').resolve()
          dest.mkdir()
          with zipfile.ZipFile(matches[0]) as z:
              if z.testzip(): raise SystemExit('Corrupt source ZIP')
              for info in z.infolist():
                  target = (dest / info.filename).resolve()
                  if not target.is_relative_to(dest): raise SystemExit('Unsafe archive member')
                  if (info.external_attr >> 16) & 0o170000 == 0o120000: raise SystemExit('Symlinks are not allowed')
              z.extractall(dest)
          print('Verified fixed source SHA-256:', os.environ['ARCHIVE_SHA256'])
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13 (no compiler upgrade at build time)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 36
        timeout-minutes: 8
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore Firebase and optional release signing
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          FIREBASE_JSON_B64: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_JSON: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON }}
          KEYSTORE_B64: ${{ secrets.HALAQATI_KEYSTORE_BASE64 }}
          HALAQATI_STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          HALAQATI_KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          HALAQATI_KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.HALAQATI_EXPECTED_SIGNING_CERT_SHA256 }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64
          from pathlib import Path
          b64 = os.environ.get('FIREBASE_JSON_B64','')
          raw = base64.b64decode(b64).decode() if b64 else os.environ.get('FIREBASE_JSON','')
          if not raw: raise SystemExit('Missing HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 or HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON')
          data = json.loads(raw)
          packages = [c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in data.get('client',[])]
          if 'com.mohammedsamir.halaqati' not in packages: raise SystemExit('Firebase package mismatch')
          Path('app/google-services.json').write_text(raw)
          if os.environ['VARIANT'] == 'release':
              for name in ['KEYSTORE_B64','HALAQATI_STORE_PASSWORD','HALAQATI_KEY_ALIAS','HALAQATI_KEY_PASSWORD','EXPECTED_CERT']:
                  if not os.environ.get(name): raise SystemExit('Missing release signing secret: '+name)
              p = Path(os.environ['RUNNER_TEMP'])/'halaqati-release.jks'
              p.write_bytes(base64.b64decode(os.environ['KEYSTORE_B64']))
              with open(os.environ['GITHUB_ENV'],'a') as f: f.write('HALAQATI_KEYSTORE_PATH='+str(p)+'\n')
          print('Firebase configuration validated; signing inputs checked.')
          PY

      - name: Static contracts and compiler regression checks
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          for check in scripts/*check.py; do python3 "$check"; done

      - name: Compile Kotlin (bounded, with diagnostics)
        timeout-minutes: 16
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VARIANT: ${{ inputs.variant }}
          HALAQATI_STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          HALAQATI_KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          HALAQATI_KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          free -h
          # Explicit command-line properties override any stale user Gradle settings.
          task=compileDebugKotlin
          if [ "$VARIANT" = release ]; then task=compileReleaseKotlin; fi
          python3 scripts/ci-build.py "$task" 840

      - name: Tests, lint and assemble chosen APK
        timeout-minutes: 16
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VARIANT: ${{ inputs.variant }}
          HALAQATI_STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          HALAQATI_KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          HALAQATI_KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$VARIANT" = release ]; then
            python3 scripts/ci-build.py 'testReleaseUnitTest,lintRelease,assembleRelease' 840
          else
            python3 scripts/ci-build.py 'testDebugUnitTest,lintDebug,assembleDebug' 840
          fi

      - name: Verify APK and signing identity
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VARIANT: ${{ inputs.variant }}
          EXPECTED_CERT: ${{ secrets.HALAQATI_EXPECTED_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p verified
          APK="app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > ci-logs/apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > ci-logs/badging.txt
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('ci-logs/badging.txt').read_text()
          assert "name='com.mohammedsamir.halaqati'" in text
          assert "versionCode='24502'" in text
          assert "sdkVersion:'23'" in text and "targetSdkVersion:'36'" in text
          if os.environ['VARIANT'] == 'release':
              cert = re.search(r'Signer #1 certificate SHA-256 digest: (\S+)',Path('ci-logs/apksigner.txt').read_text()).group(1)
              normalize = lambda v: re.sub(r'[:\s]','',v).lower()
              assert normalize(cert) == normalize(os.environ['EXPECTED_CERT']), 'Signing certificate mismatch'
          PY
          cp "$APK" "verified/Halaqati-v2.45.2-$VARIANT.apk"
          cd verified
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK only after all gates pass
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v2.45.2-${{ inputs.variant }}
          path: ${{ env.PROJECT_DIR }}/verified/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs and test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-build-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.PROJECT_DIR }}/ci-logs/
            ${{ env.PROJECT_DIR }}/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove restored secrets
        if: always()
        run: |
          rm -f "$PROJECT_DIR/app/google-services.json" "$RUNNER_TEMP/halaqati-release.jks"
